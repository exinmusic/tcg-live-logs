AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pokemon TCG Log Visualizer - Static Site Hosting with CloudFront
Parameters:
  CognitoUserPoolName:
    Type: String
    Default: tcg-log-visualizer-users
    Description: Name for the Cognito User Pool
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Ref: CognitoUserPoolName
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
      - Name: email
        AttributeDataType: String
        Required: true
        Mutable: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
        - email
    Metadata:
      SamResourceId: UserPool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: ${AWS::StackName}-web-client
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
    Metadata:
      SamResourceId: UserPoolClient
  GameLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-GameLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: logId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: logId
        KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
    Metadata:
      SamResourceId: GameLogsTable
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DynamoDBAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            Resource:
            - Fn::GetAtt:
              - GameLogsTable
              - Arn
            - Fn::Sub: ${GameLogsTable.Arn}/index/*
    Metadata:
      SamResourceId: LambdaExecutionRole
  StoreLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-StoreLog
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-qvu3v64hv4kt/tcg-log-visualizer/15c04273bf17e7bf8ca6a161aef3c409
      Handler: storeLog.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Environment:
        Variables:
          TABLE_NAME:
            Ref: GameLogsTable
          ALLOWED_ORIGIN:
            Fn::Sub: https://${CloudFrontDistribution.DomainName}
      Events:
        StoreLogApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: LogsApi
            Path: /logs
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      SamResourceId: StoreLogFunction
  GetLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-GetLogs
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-qvu3v64hv4kt/tcg-log-visualizer/15c04273bf17e7bf8ca6a161aef3c409
      Handler: getLogs.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Environment:
        Variables:
          TABLE_NAME:
            Ref: GameLogsTable
          ALLOWED_ORIGIN:
            Fn::Sub: https://${CloudFrontDistribution.DomainName}
      Events:
        GetLogsApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: LogsApi
            Path: /logs
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      SamResourceId: GetLogsFunction
  GetLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-GetLog
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-qvu3v64hv4kt/tcg-log-visualizer/15c04273bf17e7bf8ca6a161aef3c409
      Handler: getLog.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Environment:
        Variables:
          TABLE_NAME:
            Ref: GameLogsTable
          ALLOWED_ORIGIN:
            Fn::Sub: https://${CloudFrontDistribution.DomainName}
      Events:
        GetLogApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: LogsApi
            Path: /logs/{logId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
    Metadata:
      SamResourceId: GetLogFunction
  LogsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-LogsApi
      StageName: prod
      Cors:
        AllowOrigin:
          Fn::Sub: '''https://${CloudFrontDistribution.DomainName}'''
        AllowHeaders: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowCredentials: true
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::GetAtt:
              - UserPool
              - Arn
            Identity:
              Header: Authorization
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
    Metadata:
      SamResourceId: LogsApi
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-app-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
    Metadata:
      SamResourceId: AppBucket
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-images-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - HEAD
          AllowedOrigins:
          - '*'
          MaxAge: 3600
    Metadata:
      SamResourceId: ImageBucket
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-OAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
    Metadata:
      SamResourceId: CloudFrontOriginAccessControl
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_All
        Origins:
        - Id: S3Origin
          DomainName:
            Fn::GetAtt:
            - AppBucket
            - RegionalDomainName
          S3OriginConfig:
            OriginAccessIdentity: ''
          OriginAccessControlId:
            Fn::GetAtt:
            - CloudFrontOriginAccessControl
            - Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
        CustomErrorResponses:
        - ErrorCode: 404
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 300
        - ErrorCode: 403
          ResponseCode: 200
          ResponsePagePath: /index.html
          ErrorCachingMinTTL: 300
    Metadata:
      SamResourceId: CloudFrontDistribution
  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: AppBucket
      PolicyDocument:
        Statement:
        - Sid: AllowCloudFrontServicePrincipal
          Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${AppBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
    Metadata:
      SamResourceId: AppBucketPolicy
  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: ImageBucket
      PolicyDocument:
        Statement:
        - Sid: PublicReadGetObject
          Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${ImageBucket.Arn}/*
    Metadata:
      SamResourceId: ImageBucketPolicy
Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value:
      Ref: UserPool
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-UserPoolId
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value:
      Ref: UserPoolClient
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-UserPoolClientId
  UserPoolArn:
    Description: Cognito User Pool ARN
    Value:
      Fn::GetAtt:
      - UserPool
      - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-UserPoolArn
  GameLogsTableName:
    Description: DynamoDB Table Name for Game Logs
    Value:
      Ref: GameLogsTable
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-GameLogsTableName
  GameLogsTableArn:
    Description: DynamoDB Table ARN for Game Logs
    Value:
      Fn::GetAtt:
      - GameLogsTable
      - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-GameLogsTableArn
  LogsApiUrl:
    Description: API Gateway endpoint URL for logs
    Value:
      Fn::Sub: https://${LogsApi}.execute-api.${AWS::Region}.amazonaws.com/prod
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-LogsApiUrl
  LogsApiId:
    Description: API Gateway REST API ID
    Value:
      Ref: LogsApi
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-LogsApiId
  WebsiteURL:
    Description: CloudFront Distribution URL
    Value:
      Fn::Sub: https://${CloudFrontDistribution.DomainName}
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-WebsiteURL
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID for cache invalidation
    Value:
      Ref: CloudFrontDistribution
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-CloudFrontDistributionId
  AppBucketName:
    Description: Name of the S3 bucket for the React application
    Value:
      Ref: AppBucket
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-AppBucketName
  ImageBucketName:
    Description: Name of the S3 bucket for card images
    Value:
      Ref: ImageBucket
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ImageBucketName
  ImageBucketURL:
    Description: Public URL for the Image Bucket
    Value:
      Fn::Sub: https://${ImageBucket.RegionalDomainName}
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ImageBucketURL
